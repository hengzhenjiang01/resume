name: Deploy to Tencent COS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install COSCLI
        run: |
          curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux -o coscli
          sudo install -m 0755 coscli /usr/local/bin/coscli

      - name: Configure COSCLI
        run: |
          coscli config add \
            -i "${{ secrets.TENCENT_SECRET_ID }}" \
            -k "${{ secrets.TENCENT_SECRET_KEY }}" \
            -b "${{ secrets.COS_BUCKET }}" \
            -r "${{ secrets.COS_REGION }}"

      - name: Sync dist to COS
        run: |
          coscli sync ./dist/ "cos://${{ secrets.COS_BUCKET }}/" --recursive --delete
